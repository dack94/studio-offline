name: Crea APK Android
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  issues: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          set -o pipefail
          exec > >(tee -a build-log.txt) 2>&1
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools unavailable"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Recupera firma persistente APK
        uses: actions/cache@v4
        with:
          path: app/debug.keystore
          key: studio-offline-debug-signing-v1
      - name: Crea firma debug al primo avvio
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkeypair -alias studiooffline -keyalg RSA -keysize 2048 -validity 10000 -keystore app/debug.keystore -storepass android -keypass android -dname "CN=Studio Offline Debug,O=Studio Offline,C=IT" -noprompt
          fi
      - name: Compila APK debug installabile
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee -a build-log.txt
      - name: Report build failure to GitHub issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'Run: %s\nCommit: %s\n\n```\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$GITHUB_SHA" > failure-report.md
          if [ -f build-log.txt ]; then tail -n 120 build-log.txt >> failure-report.md; else echo 'No build log generated' >> failure-report.md; fi
          printf '\n```\n' >> failure-report.md
          gh issue create --title "Android build failed: run $GITHUB_RUN_ID" --body-file failure-report.md || true
      - name: Pubblica APK
        uses: actions/upload-artifact@v4
        with:
          name: StudioOffline-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
